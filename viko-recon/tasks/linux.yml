---
- name: Detectar Python 3 sin depender de gather_facts
  ansible.builtin.raw: |
    found=0
    for candidate in python3 python3.14 python3.13 python3.12 python3.11 python3.10 python3.9 python3.8 python3.7 python3.6 /usr/libexec/platform-python /usr/bin/python3 /usr/local/bin/python3; do
      p=$(command -v "$candidate" 2>/dev/null) || continue
      found=1
      "$p" -B -c 'import sys; print("VIKO_PY=" + sys.executable) if sys.version_info >= (3,6) else sys.exit(4)' 2>/dev/null && exit 0
    done
    if [ "$found" = 0 ]; then exit 3; else exit 4; fi
  register: _vuln_python
  become: "{{ (vuln_become | default(vuln_defaults_become)) | bool }}"
  changed_when: false
  failed_when: false
  timeout: 30

- name: Registrar conectividad o requisito faltante
  ansible.builtin.set_fact:
    _vuln_raw:
      status: no_evaluado
      reason: >-
        {{ 'Fallo de conexión SSH o autenticación; revisar el evento de conexión'
           if _vuln_python.unreachable | default(false)
           else ('No se encontró Python en los nombres y rutas consultados'
           if _vuln_python.rc | default(-1) | int == 3
           else ('Los intérpretes encontrados no superaron la prueba Python >= 3.6'
           if _vuln_python.rc | default(-1) | int == 4
           else 'Falló la comprobación inicial; no se atribuye automáticamente a falta de Python')) }}
      diagnostics:
        stage: linux_preflight
        code: "{{ 'connection_failed' if _vuln_python.unreachable | default(false) else ('interpreter_not_found' if _vuln_python.rc | default(-1) | int == 3 else ('interpreter_probe_failed' if _vuln_python.rc | default(-1) | int == 4 else 'preflight_failed')) }}"
        exit_code: "{{ _vuln_python.rc | default(-1) | int }}"

- name: Recolectar evidencia Linux
  ansible.builtin.raw: |
    {{ (_vuln_python.stdout | regex_findall('VIKO_PY=([^\r\n]+)') | first) | quote }} -B - {{ _vuln_config | to_json | b64encode | quote }} <<'VIKO_RECON_PY'
    {{ lookup('ansible.builtin.file', playbook_dir ~ '/scripts/collect_linux.py') }}
    VIKO_RECON_PY
  register: _vuln_collector
  become: "{{ (vuln_become | default(vuln_defaults_become)) | bool }}"
  changed_when: false
  failed_when: false
  timeout: "{{ (vuln_task_timeout | default(vuln_defaults_task_timeout)) | int }}"
  no_log: true
  when:
    - not (_vuln_python.unreachable | default(false))
    - _vuln_python.stdout | default('') | regex_search('VIKO_PY=') is not none

- name: Registrar fallo de ejecución Linux sin publicar salida cruda
  ansible.builtin.set_fact:
    _vuln_raw:
      status: no_evaluado
      reason: "{{ 'Fallo de conexión durante la recolección Linux' if _vuln_collector.unreachable | default(false) else 'Python fue localizado, pero el recolector no devolvió evidencia; revisar etapa y código de salida' }}"
      diagnostics:
        stage: linux_collector
        code: "{{ 'connection_failed' if _vuln_collector.unreachable | default(false) else ('collector_exit_nonzero' if _vuln_collector.rc | default(-1) | int != 0 else 'collector_marker_missing') }}"
        exit_code: "{{ _vuln_collector.rc | default(-1) | int }}"
  when:
    - not (_vuln_collector.skipped | default(false))

- name: Incorporar evidencia válida Linux
  ansible.builtin.set_fact:
    _vuln_raw: "{{ (_vuln_collector.stdout | regex_findall('VIKO_VULN_JSON:([^\r\n]+)') | last) | from_json }}"
  no_log: true
  when:
    - not (_vuln_collector.skipped | default(false))
    - not (_vuln_collector.unreachable | default(false))
    - _vuln_collector.stdout | default('') | regex_search('VIKO_VULN_JSON:') is not none
