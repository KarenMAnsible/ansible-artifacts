        - ibm_itzoil_proemersonws
      ansible.builtin.assert:
        that:
        - ansible_limit | default('') | trim | length > 0
        - '''localhost'' not in ansible_play_hosts_all'
        - ansible_play_hosts_all | length <= 20
        - ansible_play_hosts_all | difference(_viko_php_campaign_aliases if (vuln_checks | default(vuln_defaults_checks)) == ['php']
          else ['huawei_viko_new_pruebas_seguridad', 'gcp_sin_definir_trend', 'alibaba_viko_ecs_ansible', 'huawei_viko_new_vikowebnew'])
          | length == 0
        fail_msg: 'Revise el Limite: solo alias autorizados, sin localhost y maximo 20 equipos.'
      run_once: true
      when: '''php'' in (vuln_checks | default(vuln_defaults_checks))'

    # VIKO_VAULT_ACCESOS_V1
    - name: Preparar acceso desde Vault cuando se solicita
      ansible.builtin.include_tasks: tasks/vault_accesos.yml
      when: vuln_use_vault | default(false) | bool
      tags: always

    - name: Validar selección de familias
      ansible.builtin.assert:
        that:
          - (vuln_checks | default(vuln_defaults_checks)) is sequence
          - (vuln_checks | default(vuln_defaults_checks)) is not string
          - (vuln_checks | default(vuln_defaults_checks)) is not mapping
          - (vuln_checks | default(vuln_defaults_checks)) | length > 0
          - (vuln_checks | default(vuln_defaults_checks)) | difference(['php', 'log4j', 'struts']) | length == 0
          - not ansible_check_mode
          - not (vuln_php_inventory_only | default(false) | bool) or (vuln_checks | default(vuln_defaults_checks)) == ['php']
        fail_msg: 'Use (vuln_checks | default(vuln_defaults_checks)): [php, log4j, struts]. Ejecute normalmente: --check no realiza este reconocimiento.'
      run_once: true

    - name: Validar límites de cada servidor
      ansible.builtin.assert:
        that:
          - (vuln_scan_seconds | default(vuln_defaults_scan_seconds) | int) >= 1
          - (vuln_task_timeout | default(vuln_defaults_task_timeout) | int) >= ((vuln_scan_seconds | default(vuln_defaults_scan_seconds) | int) + 40)
          - (vuln_command_timeout | default(vuln_defaults_command_timeout) | int) >= 1
          - (vuln_max_files | default(vuln_defaults_max_files) | int) >= 1
          - (vuln_max_archives | default(vuln_defaults_max_archives) | int) >= 1
          - (vuln_max_archive_mb | default(vuln_defaults_max_archive_mb) | int) >= 1
          - (vuln_max_nested_mb | default(vuln_defaults_max_nested_mb) | int) >= 1
          - (vuln_max_total_nested_mb | default(vuln_defaults_max_total_nested_mb) | int) >= 1
          - (vuln_archive_depth | default(vuln_defaults_archive_depth) | int) >= 0
          - (vuln_archive_depth | default(vuln_defaults_archive_depth) | int) <= 5
        fail_msg: 'Límites inválidos: task_timeout debe superar scan_seconds al menos 40 segundos.'

    - name: Inicializar resultado y plataforma según conexión del inventario
      ansible.builtin.set_fact:
        _vuln_windows: "{{ (vuln_platform | default('auto') == 'windows') or ((vuln_platform | default('auto') == 'auto') and ((ansible_connection | default('ssh')) in ['winrm', 'psrp'] or (ansible_shell_type | default('')) == 'powershell')) }}"
        _vuln_raw:
          status: no_evaluado
          reason: El recolector no finalizó.
        _vuln_config:
          checks: "{{ (vuln_checks | default(vuln_defaults_checks)) }}"
          scan_seconds: "{{ (vuln_scan_seconds | default(vuln_defaults_scan_seconds)) | int }}"
          command_timeout: "{{ (vuln_command_timeout | default(vuln_defaults_command_timeout)) | int }}"
          max_files: "{{ (vuln_max_files | default(vuln_defaults_max_files)) | int }}"
          max_archives: "{{ (vuln_max_archives | default(vuln_defaults_max_archives)) | int }}"
          max_archive_mb: "{{ (vuln_max_archive_mb | default(vuln_defaults_max_archive_mb)) | int }}"
          max_nested_mb: "{{ (vuln_max_nested_mb | default(vuln_defaults_max_nested_mb)) | int }}"
          max_total_nested_mb: "{{ (vuln_max_total_nested_mb | default(vuln_defaults_max_total_nested_mb)) | int }}"
          max_entries: "{{ (vuln_max_entries | default(vuln_defaults_max_entries)) | int }}"
          archive_depth: "{{ (vuln_archive_depth | default(vuln_defaults_archive_depth)) | int }}"
          max_observations: "{{ (vuln_max_observations | default(vuln_defaults_max_observations)) | int }}"
          php_config_paths: "{{ vuln_php_config_paths | default([]) }}"
          php_inventory_only: "{{ vuln_php_inventory_only | default(false) | bool }}"
          run_php_version: "{{ (vuln_run_php_version | default(vuln_defaults_run_php_version)) | bool }}"
          container_inventory: "{{ (vuln_container_inventory | default(vuln_defaults_container_inventory)) | bool }}"
          follow_mounts: "{{ (vuln_follow_mounts | default(vuln_defaults_follow_mounts)) | bool }}"
          linux_roots: "{{ (vuln_linux_roots | default(vuln_defaults_linux_roots)) }}"
          linux_excludes: "{{ (vuln_linux_excludes | default(vuln_defaults_linux_excludes)) }}"
          windows_roots: "{{ (vuln_windows_roots | default(vuln_defaults_windows_roots)) }}"
          windows_excludes: "{{ (vuln_windows_excludes | default(vuln_defaults_windows_excludes)) }}"

    - name: Ejecutar recolector y conservar fallos como no evaluados
      block:
        - name: Cargar tareas de la plataforma
          ansible.builtin.include_tasks: "tasks/{{ 'windows' if _vuln_windows else 'linux' }}.yml"
      rescue:
        - name: Registrar fallo sin publicar salida ni credenciales
          ansible.builtin.set_fact:
            _vuln_raw:
              status: no_evaluado
              reason: Error o timeout del recolector; revisar el evento fallido del Job.
              diagnostics:
                stage: ansible_collection
                code: task_failed_or_timeout

    - name: Mostrar únicamente resumen de recolección por equipo
      ansible.builtin.debug:
        msg:
          servidor: "{{ inventory_hostname }}"
          estado: "{{ _vuln_raw.status | default('no_evaluado') }}"
          componentes: "{{ _vuln_raw.observations | default([]) | length }}"
          cobertura: "{{ _vuln_raw.coverage.file_search | default('no_evaluado') }}"

    - name: Consolidar evidencia en el entorno de ejecución
      run_once: true
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      block:
        - name: Exigir objetivos válidos
          ansible.builtin.assert:
            that: ansible_play_hosts_all | default([]) | length > 0
            fail_msg: 'No se seleccionaron equipos. Revise inventario, vuln_target y Limit.'

        - name: Crear directorio privado temporal de resultados
          ansible.builtin.tempfile:
            state: directory
            prefix: viko-recon-
          register: _vuln_temp
          when: (vuln_report_dir | default(vuln_defaults_report_dir)) | length == 0

        - name: Seleccionar directorio de esta ejecución
          ansible.builtin.set_fact:
            _vuln_out_dir: "{{ (vuln_report_dir | default(vuln_defaults_report_dir)) if (vuln_report_dir | default(vuln_defaults_report_dir)) | length > 0 else _vuln_temp.path }}"
            _vuln_input: []

        - name: Preparar directorio de resultados
          ansible.builtin.file:
            path: "{{ _vuln_out_dir }}"
            state: directory
            mode: '0700'

        - name: Consolidar todos los objetivos
          ansible.builtin.set_fact:
            _vuln_input: >-
              {{ _vuln_input + [{
                'host': item,
                'address': hostvars[item].ansible_host | default(item),
                'customer': hostvars[item].vuln_customer | default('SIN_ASIGNAR'),
                'security_coverage': hostvars[item].vuln_security_coverage | default('desconocido'),
                'security_coverage_source': hostvars[item].vuln_security_coverage_source | default(''),
                'vendor_evidence': hostvars[item].vuln_vendor_evidence | default([]),
                'raw': hostvars[item]._vuln_raw | default({'status':'no_evaluado','reason':'No se recibió evidencia'})
              }] }}
          loop: "{{ ansible_play_hosts_all }}"
          no_log: true

        - name: Preparar cruce de inventario sin divulgar accesos
          ansible.builtin.include_tasks: tasks/audit_inventory.yml

        - name: Escribir entrada privada para consolidación
          ansible.builtin.copy:
            content: "{{ {'checks': (vuln_checks | default(vuln_defaults_checks)), 'hosts': _vuln_input, 'inventory_audit': _vuln_audit, 'access_records_count': _vuln_audit_access | length} | to_nice_json }}"
            dest: "{{ _vuln_out_dir }}/entrada.json"
            mode: '0600'
          no_log: true

        - name: Clasificar y generar TXT, JSON, CSV, HTML y paquete recuperable
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/scripts/report.py"
              - --input
              - "{{ _vuln_out_dir }}/entrada.json"
              - --out
              - "{{ _vuln_out_dir }}"
              - --txt-dir
              - "{{ vuln_txt_dir | default('') }}"
              - --artifact-limit
              - "{{ (vuln_aap_artifact_max_bytes | default(vuln_defaults_aap_artifact_max_bytes)) | string }}"
          register: _vuln_report
          timeout: 90
          changed_when: false
          no_log: true

        - name: Preparar artefactos
          ansible.builtin.set_fact:
            _vuln_artifacts: "{{ _vuln_report.stdout | from_json }}"
          no_log: true

        - name: Publicar resultados en los artefactos del Job
          ansible.builtin.set_stats:
            data: "{{ _vuln_artifacts }}"
            per_host: false
            aggregate: false

        - name: Mostrar resumen y disponibilidad del reporte completo
          ansible.builtin.debug:
            msg:
              resumen: "{{ _vuln_artifacts.viko_vuln_summary }}"
              directorio: "{{ _vuln_out_dir }}"
              reporte_en_artefactos: "{{ _vuln_artifacts.viko_vuln_bundle_status }}"
              aviso: 'En AAP descargue artifacts antes de perder acceso al Job. Los archivos del EE son temporales, salvo montaje persistente configurado.'

        - name: Exigir evidencia en todos los equipos del piloto cuando se solicita
          ansible.builtin.assert:
            that: _vuln_artifacts.viko_vuln_summary.hosts_not_evaluated | int == 0
            fail_msg: 'Se guardaron los reportes, pero hay equipos sin evidencia. Revisar diagnóstico antes de ampliar las corridas.'
          when: vuln_fail_no_evidence | default(false) | bool
