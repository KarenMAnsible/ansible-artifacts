---
- name: Auditar integridad local y artefactos PHP cargados sin publicar configuraciones
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/scripts/audit_php.py"
    executable: "{{ ansible_facts.python.executable }}"
  become: "{{ remed_linux_become | default(true) | bool }}"
  changed_when: false
  register: _php_audit_raw
  timeout: 150
  no_log: true

- name: Adjuntar auditoría acotada al reporte
  ansible.builtin.set_fact:
    _remed_result: "{{ _remed_result | combine({(remed_audit_slot): ((_php_audit_raw.stdout | regex_findall('VIKO_PHP_AUDIT:([^\r\n]+)') | last) | from_json)}) }}"
