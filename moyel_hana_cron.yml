---
# AAP: Two scheduled job templates, one for prepare at 02:00 and one for upload at 05:00.
# Both templates: Inventory Assessment-Servidores; Limit huawei_grupomoyel_b1_hana.
# /Backup is XFS without reflink. Never copy 117 GB to another path on /Backup.
# OBS retention touches only date prefixes with this script's .complete marker.
- name: Ejecutar respaldo HANA de Moyel desde AAP
  hosts: all
  gather_facts: false
  become: true
  vars:
    moyel_expected_ip: '94.74.71.221'
    moyel_vault_alias: huawei_grupomoyel_b1_hana
    moyel_obsutil_path: /root/obsutil_linux_amd64_5.4.11/obsutil
  pre_tasks:
    - name: Limitar la ejecución al servidor de Moyel
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == moyel_vault_alias
          - (ansible_host | default(inventory_hostname)) == moyel_expected_ip
          - moyel_action | default('') in ['prepare', 'upload']
        fail_msg: 'Configurar Limit huawei_grupomoyel_b1_hana, IP 94.74.71.221 y moyel_action prepare/upload.'

    - name: Admitir fecha histórica únicamente en modo de comprobación
      ansible.builtin.assert:
        that:
          - ansible_check_mode
          - (moyel_check_day | string) is match('^20[0-9]{2}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$')
        fail_msg: 'moyel_check_day solo sirve para una fecha ISO en modo Comprobar; no se permite en tareas reales.'
      when: moyel_check_day is defined

    - name: Cargar el Vault de accesos sin exponerlo
      ansible.builtin.include_vars:
        file: '{{ playbook_dir }}/group_vars/all/vault.yml'
        name: _moyel_vault
      no_log: true

    - name: Seleccionar la credencial exacta de Moyel
      ansible.builtin.set_fact:
        _moyel_access: "{{ _moyel_vault.viko_assessment_access.get(moyel_vault_alias, {}) }}"
      no_log: true

    - name: Validar la credencial antes de conectar
      ansible.builtin.assert:
        that:
          - _moyel_access is mapping
          - _moyel_access.status | default('pendiente') == 'listo'
          - _moyel_access.family | default('') == 'linux'
          - _moyel_access.mode | default('') in ['password', 'key']
          - (_moyel_access.address | default('') | string) == moyel_expected_ip
          - (_moyel_access.user | default('') | string | length) > 0
          - _moyel_access.mode | default('') != 'password' or (_moyel_access.password | default('') | string | length) > 0
        fail_msg: 'Revisar el acceso de Moyel en Vault: alias, estado, familia, IP y usuario.'
      no_log: true

    - name: Aplicar usuario, dirección y puerto del Vault
      ansible.builtin.set_fact:
        ansible_host: '{{ _moyel_access.address }}'
        ansible_user: '{{ _moyel_access.user }}'
        ansible_connection: ssh
        ansible_port: "{{ _moyel_access.port | default(22) | int }}"
      no_log: true

    - name: Aplicar la contraseña solo si el acceso es de ese tipo
      ansible.builtin.set_fact:
        ansible_password: '{{ _moyel_access.password }}'
        ansible_ssh_pass: '{{ _moyel_access.password }}'
      when: _moyel_access.mode == 'password'
      no_log: true

    - name: Comprobar obsutil
      ansible.builtin.stat:
        path: '{{ moyel_obsutil_path }}'
      register: moyel_obsutil_file

    - name: Requerir el ejecutable existente
      ansible.builtin.assert:
        that:
          - moyel_obsutil_file.stat.exists
          - moyel_obsutil_file.stat.isreg

    - name: Comprobar herramientas de control
      ansible.builtin.shell: 'command -v flock && command -v logger && command -v stat'
      changed_when: false
      check_mode: false

    - name: Obtener fecha de respaldo del propio servidor
      ansible.builtin.command:
        argv:
          - date
          - -d
          - "{{ moyel_check_day | default('today') }}"
          - +%d%b%y
      environment:
        LC_ALL: C
      changed_when: false
      check_mode: false
      register: moyel_backup_label

    - name: Confirmar en HANA las tres partes de un backup exitoso
      ansible.builtin.command:
        argv:
          - /usr/sap/NDB/HDB00/exe/hdbsql
          - -U
          - BKPMONNDB
          - >-
            SELECT 'MOYEL_HANA_OK' AS RESULT
            FROM SYS.M_BACKUP_CATALOG c
            JOIN SYS.M_BACKUP_CATALOG_FILES f ON c.ENTRY_ID = f.ENTRY_ID
            WHERE LOWER(c.ENTRY_TYPE_NAME) = 'complete data backup'
              AND LOWER(c.STATE_NAME) = 'successful'
              AND REPLACE(f.DESTINATION_PATH, '//', '/') LIKE '/Backup/DB_NDB/Data/DB_NDB/FULL_BKP_NDB_{{ moyel_backup_label.stdout }}_databackup_%'
            GROUP BY c.BACKUP_ID
            HAVING COUNT(DISTINCT f.DESTINATION_PATH) = 3
      become_user: ndbadm
      changed_when: false
      check_mode: false
      register: moyel_catalog_result
      failed_when: >-
        moyel_catalog_result.rc != 0 or
        not (moyel_catalog_result.stdout is search('(?m)^"?MOYEL_HANA_OK"?$'))

  tasks:
    - name: Crear directorio privado de manifiestos
      ansible.builtin.file:
        path: /var/lib/moyel-hana-backup
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Instalar script sin copia local adicional
      ansible.builtin.copy:
        dest: /usr/local/sbin/moyel-hana-backup
        owner: root
        group: root
        mode: '0700'
        content: |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          shopt -s nullglob
          export LC_ALL=C
          action="${1:-}"
          source_dir=/Backup/DB_NDB/Data/DB_NDB
          state_dir=/var/lib/moyel-hana-backup
          obsutil=/root/obsutil_linux_amd64_5.4.11/obsutil
          obs_prefix=obs://moyel-backup/MOYEL-RESPALDOS/BACKUP2026
          day="$(date +%F)"
          label="$(date +%d%b%y)"
          manifest="$state_dir/$day.manifest"

          failure() {
            local status=$?
            (( status == 0 )) || logger -p daemon.err -t moyel-hana-backup -- "FAILED action=$action day=$day rc=$status"
          }
          trap failure EXIT
          die() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }
          [[ "$action" == prepare || "$action" == upload ]] || die 'Accion invalida'
          [[ -d "$source_dir" && -d "$state_dir" && -x "$obsutil" ]] || die 'Falta origen, estado u obsutil'
          exec 9>"$state_dir/lock"
          flock -n 9 || die 'Hay otra tarea de Moyel en curso'
          files=( "$source_dir"/FULL_BKP_NDB_"$label"_databackup_* )
          file_count=0
          for file in "${files[@]}"; do
            (( file_count += 1 ))
          done
          (( file_count == 3 )) || die "Se esperaban tres partes del respaldo $label"
          for part in 0_1 2_1 3_1; do
            [[ -f "$source_dir/FULL_BKP_NDB_${label}_databackup_$part" ]] || die "Falta parte $part"
          done

          if [[ "$action" == prepare ]]; then
            now="$(date +%s)"
            before=()
            for file in "${files[@]}"; do
              [[ -f "$file" && ! -L "$file" ]] || die "Archivo inesperado: $file"
              size="$(stat -c %s -- "$file")"
              (( size > 0 )) || die "Archivo vacio: $file"
              mtime="$(stat -c %Y -- "$file")"
              (( now - mtime >= 1200 )) || die "Archivo aun reciente: $file"
              before+=( "$size:$mtime" )
            done
            sleep 30
            for i in "${!files[@]}"; do
              [[ "$(stat -c '%s:%Y' -- "${files[$i]}")" == "${before[$i]}" ]] || die 'El respaldo cambio durante la validacion'
            done
            temp="$(mktemp "$state_dir/.manifest.XXXXXXXX")"
            trap 'rm -f -- "$temp"; failure' EXIT
            for file in "${files[@]}"; do
              printf '%s\t%s\t%s\n' "${file##*/}" "$(stat -c %s -- "$file")" "$(stat -c %Y -- "$file")" >> "$temp"
            done
            chmod 0600 "$temp"
            mv -f -- "$temp" "$manifest"
            trap failure EXIT
            logger -t moyel-hana-backup -- "PREPARE_OK day=$day parts=$file_count"
            exit 0
          fi

          [[ -s "$manifest" ]] || die 'Falta manifiesto de las 02:00'
          parts="$(wc -l < "$manifest")"
          (( parts == file_count )) || die 'Cambio el numero de partes desde las 02:00'
          while IFS=$'\t' read -r filename size mtime; do
            [[ "$filename" == FULL_BKP_NDB_"$label"_databackup_* ]] || die "Nombre inesperado: $filename"
            file="$source_dir/$filename"
            [[ -f "$file" && ! -L "$file" ]] || die "Falta: $filename"
            [[ "$(stat -c '%s:%Y' -- "$file")" == "$size:$mtime" ]] || die "Cambio: $filename"
          done < "$manifest"

          while IFS=$'\t' read -r filename size mtime; do
            "$obsutil" sync "$source_dir/$filename" "$obs_prefix/$day/$filename" -vlength
          done < "$manifest"
          marker="$state_dir/$day.complete"
          printf 'day=%s\nparts=%s\n' "$day" "$parts" > "$marker"
          chmod 0600 "$marker"
          "$obsutil" sync "$marker" "$obs_prefix/$day/.complete" -vlength
          logger -t moyel-hana-backup -- "UPLOAD_OK day=$day parts=$parts"

          # Retain at least today's and the two prior complete daily backups.
          # Delete only one older prefix owned by this script, never legacy folders.
          keep_complete=1
          for offset in 1 2; do
            previous="$(date -d "$day - $offset days" +%F)"
            key="$obs_prefix/$previous/.complete"
            listing="$("$obsutil" ls "$key" -limit=1)" || die "OBS no disponible: $key"
            grep -Fq -- "$key" <<< "$listing" || keep_complete=0
          done
          older="$(date -d "$day - 3 days" +%F)"
          old_key="$obs_prefix/$older/.complete"
          if (( keep_complete )); then
            listing="$("$obsutil" ls "$old_key" -limit=1)" || die "OBS no disponible: $old_key"
            if grep -Fq -- "$old_key" <<< "$listing"; then
              "$obsutil" rm "$obs_prefix/$older/" -r -f
              logger -t moyel-hana-backup -- "RETENTION_OK removed=$older"
            fi
          else
            logger -p daemon.warning -t moyel-hana-backup -- 'RETENTION_SKIPPED missing previous complete day'
          fi

    - name: Ejecutar la fase solicitada por AAP
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/moyel-hana-backup
          - '{{ moyel_action }}'
